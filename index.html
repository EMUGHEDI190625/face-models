<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ECN Face Recognition System</title>

<script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>

<style>
body{
font-family:Arial,sans-serif;
text-align:center;
padding:10px;
}
video,canvas{
border:1px solid #ccc;
border-radius:8px;
margin-top:10px;
}
#status{
margin-bottom:10px;
font-weight:bold;
}
</style>
</head>

<body>

<h3>ECN Facial Recognition System</h3>

<img src="https://raw.githubusercontent.com/EMUGHEDI190625/face-models/main/images/ECN_logo.jpg"
style="display:block;width:50%;margin:0 auto;">

<div id="status">⏳ Loading system...</div>

<input type="text" id="employeeId" placeholder="Enter Employee ID"><br>
<input type="text" id="fullName" placeholder="Enter Full Name"><br>

<button id="start" disabled>Start Camera</button><br><br>

<video id="video" width="320" height="240" autoplay muted></video>
<canvas id="overlay" width="320" height="240"></canvas>

<script>
const statusEl=document.getElementById("status");
const startBtn=document.getElementById("start");
const video=document.getElementById("video");
const canvas=document.getElementById("overlay");
const ctx=canvas.getContext("2d");

let labeledDescriptors=[];
const MODEL_URL="./model/weights/";
const IMAGE_PATH="./images/";

let recognizedCount=0;
let noFaceCount=0;
let mismatchCount=0;
let currentStatus="";


/* SEND DATA TO GOOGLE SHEET */
async function sendToSheet(employeeId,fullName,imageLink){

// 🔴 PASTE YOUR WEB APP URL HERE (NOT sheet link)
const SHEET_URL="PASTE_WEBAPP_URL_HERE";

const params=new URLSearchParams({
employeeId:employeeId,
name:fullName,
imageLink:imageLink,
recognizeFace:imageLink.includes("_not_recognized")?"Face not recognized":"Face recognized",
source:"FaceRecognition"
});

try{
const response=await fetch(`${SHEET_URL}?${params.toString()}`);
console.log("Sheet response:",await response.text());
}catch(err){
console.error("Send error:",err);
}
}


/* LOAD MODELS */
async function loadModels(){
try{
statusEl.textContent="⏳ Loading models...";
await Promise.all([
faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)
]);
statusEl.textContent="✅ Models loaded — enter details and start camera.";
startBtn.disabled=false;
}catch(err){
statusEl.textContent="❌ Model load error: "+err.message;
}
}


/* LOAD STORED IMAGE */
async function loadLabeledImage(fullName){
labeledDescriptors=[];
const imgUrl=`${IMAGE_PATH}${fullName.trim()}.jpg`;

try{
const img=await faceapi.fetchImage(imgUrl);

const detection=await faceapi
.detectSingleFace(img,new faceapi.TinyFaceDetectorOptions())
.withFaceLandmarks()
.withFaceDescriptor();

if(detection){
labeledDescriptors.push(
new faceapi.LabeledFaceDescriptors(fullName,[detection.descriptor])
);
}else{
alert("No face detected in stored photo");
}

}catch(err){
alert("Image not found for "+fullName);
}
}


/* STATUS UPDATE */
function updateStatus(newStatus){
if(currentStatus!==newStatus){
statusEl.textContent=newStatus;
currentStatus=newStatus;
}
}


/* ATTENDANCE TIME CHECK (FIXED VERSION) */
function checkAttendanceTime(){

const now=new Date();

const day=now.getDay(); // 0=Sun 6=Sat
const hour=now.getHours();
const minute=now.getMinutes();
const currentTime=hour+(minute/60);

// ❌ Block weekends
  if (day === 6 || day === 7) {
    return HtmlService.createHtmlOutput(`
    <div class="wrapper" style="display: flex; justify-content: center; margin-top: 60px; ">
        <div class="container" style="max-width: 640px; width: 100%; padding: 40px 32px; border: 3px solid green;   border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.05); ">
          <h1 style="text-align:center">ECN Employees Attendance System</h1>
          <img src="https://raw.githubusercontent.com/EMUGHEDI190625/face-models/main/images/ECN_logo.jpg" alt="ECN Logo" style="  width: 15%; display: block; margin: 0 auto;"><br>
          <h2 style="text-align:center;color:red">
            ❌ Attendance Closed<br><br>
            Attendance is not allowed on weekends. Thank you
          </h2>
          <div class="footer" style="margin-top: 40px; font-size: 12px; color: #5f6368; text-align: center;      height:auto;">This content is neither created nor endorsed by Google.<br><a href="#" style="color: #5f6368; text-decoration: none; margin: 0 4px;">Report Abuse</a> - <a href="https://policies.google.com/terms" style="color: #5f6368; text-decoration: none; margin: 0 4px;">Terms of Service</a> - <a href="https://policies.google.com/privacy" style="color: #5f6368; text-decoration: none; margin: 0 4px;">Privacy Policy</a><br><br>Google Forms</div>
          </div></div>
       </div>
      </div>
    `);
  }

  // ❌ Block between 10:00 AM – 3:30 PM
  if (currentTime >= 9 && currentTime < 12.30) {
    return HtmlService.createHtmlOutput(`
    <div class="wrapper" style="display: flex; justify-content: center; margin-top: 60px;">
        <div class="container" style="max-width: 640px; width: 100%; padding: 40px 32px; border: 3px solid green;   border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.05);">
            <h1 style="text-align:center">ECN Employees Attendance System</h1>
            <img src="https://raw.githubusercontent.com/EMUGHEDI190625/face-models/main/images/ECN_logo.jpg" alt="ECN Logo" style="  width: 15%; display: block; margin: 0 auto;"><br>
            <h2 style="text-align:center;color:red">
            ⛔ Attendance Locked<br><br>
              Attendance is closed between <b>10:00 AM – 3:30 PM</b>.<br><br>
              Please return during:
              <ul>
                <li style="list-style-type:none">8:00 – 10:00 AM  during business hours eg Monday-Firday</li>
                <br>
                <li style="list-style-type:none">4:00 – 6:00 PM during business hours eg Monday-Firday</li>
                <br>
                 <li style="list-style-type:none">Thank you.</li>
              </ul>
          </h2>
          <div class="footer" style="margin-top: 40px; font-size: 12px; color: #5f6368; text-align: center;      height:auto;">This content is neither created nor endorsed by Google.<br><a href="#" style="color: #5f6368; text-decoration: none; margin: 0 4px;">Report Abuse</a> - <a href="https://policies.google.com/terms" style="color: #5f6368; text-decoration: none; margin: 0 4px;">Terms of Service</a> - <a href="https://policies.google.com/privacy" style="color: #5f6368; text-decoration: none; margin: 0 4px;">Privacy Policy</a><br><br>Google Forms</div>
          </div></div>
        </div>
      </div>
    `);
  }


/* START CAMERA */
startBtn.onclick=async()=>{

const employeeId=document.getElementById("employeeId").value.trim();
const fullName=document.getElementById("fullName").value.trim();

if(!employeeId||!fullName){
alert("Enter ID and Name");
return;
}

await loadLabeledImage(fullName);

if(labeledDescriptors.length===0){
alert("No labeled face loaded");
return;
}

const stream=await navigator.mediaDevices.getUserMedia({video:true});
video.srcObject=stream;
await video.play();

updateStatus("Camera started — scanning face...");

const faceMatcher=new faceapi.FaceMatcher(labeledDescriptors,0.6);

setInterval(async()=>{

const detections=await faceapi
.detectAllFaces(video,new faceapi.TinyFaceDetectorOptions())
.withFaceLandmarks()
.withFaceDescriptors();

ctx.clearRect(0,0,canvas.width,canvas.height);

faceapi.matchDimensions(canvas,{width:video.width,height:video.height});
const resized=faceapi.resizeResults(detections,{width:video.width,height:video.height});

if(resized.length===0){
noFaceCount++;
recognizedCount=mismatchCount=0;
if(noFaceCount>=3) updateStatus("No face detected");
return;
}

const results=resized.map(d=>faceMatcher.findBestMatch(d.descriptor));

results.forEach(async(result,i)=>{

const box=resized[i].detection.box;
new faceapi.draw.DrawBox(box,{label:result.label}).draw(canvas);

const githubImageLink=
`https://raw.githubusercontent.com/EMUGHEDI190625/face-models/main/images/${fullName}.jpg`;

if(result.label===fullName){

recognizedCount++;
mismatchCount=noFaceCount=0;

if(recognizedCount>=3){

updateStatus("Face recognized: "+fullName);
await sendToSheet(employeeId,fullName,githubImageLink);

video.srcObject.getTracks().forEach(t=>t.stop());
setTimeout(()=>window.location.href="./success.html",1000);
}

}else{

mismatchCount++;
recognizedCount=noFaceCount=0;

if(mismatchCount>=3){

updateStatus("Face mismatch");
await sendToSheet(employeeId,fullName,githubImageLink.replace(".jpg","_not_recognized.jpg"));

video.srcObject.getTracks().forEach(t=>t.stop());
setTimeout(()=>window.location.href="./fail.html",1000);
}
}

});

},800);

};


/* INIT */
window.addEventListener("load",()=>{
loadModels();
checkAttendanceTime();
});
</script>

</body>
</html>
